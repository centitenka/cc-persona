[package]
name = "cc-persona"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["KinomotoMio <kinomotomiovo@gmail.com>"]
description = "Fast persona switching for Claude Code via config overlays and symlinks"
license = "MIT"
readme = "README.md"
repository = "https://github.com/centitenka/cc-persona"
homepage = "https://github.com/centitenka/cc-persona"
documentation = "https://docs.rs/cc-persona"
keywords = ["claude", "cli", "persona", "profiles", "productivity"]
categories = ["command-line-utilities", "config"]

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
